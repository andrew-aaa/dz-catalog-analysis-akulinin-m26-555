[project]
name = "dz-catalog-analysis-akulinin-m26-555"
version = "0.1.0"
description = "Анализ каталога фильмов"
readme = "README.md"
authors = [
    { name = "Andrey Akulinin", email = "akulinin-andrey2004@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
dz-catalog-analysis-akulinin-m26-555 = "dz_catalog_analysis_akulinin_m26_555:main"
catalog_analysis = "dz_catalog_analysis_akulinin_m26_555:main"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []